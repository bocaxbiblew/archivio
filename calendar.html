<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calendario Uscite - Archivio Stream</title>
  <meta name="description" content="Le prossime uscite delle serie che stai seguendo.">
  <meta name="theme-color" content="#03030f">
  <meta name="color-scheme" content="dark light">

  <!-- Apply the saved theme before first paint so there is no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=8">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archivio">
  <link rel="apple-touch-icon" href="assets/unnamed.png">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" aria-label="Archivio — vai alla home">
        <img src="assets/unnamed.png" alt="Archivio" class="logo">
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog_series.html">Serie</a></li>
      <li><a href="catalog_movies.html">Film</a></li>
      <li><a href="calendar.html" class="active">Uscite</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://t.me/+w-cVyPMl7B5lOGY0" target="_blank" rel="noopener" class="icon-btn" title="Canale Telegram" aria-label="Canale Telegram"><i class='bx bx-bulb'></i></a>
      <button class="icon-btn" id="open-search" aria-label="Cerca"><i class='bx bx-search'></i></button>
      <button class="icon-btn" aria-label="La mia lista"><i class='bx bx-bookmark'></i></button>
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23222'/%3E%3Ccircle cx='20' cy='15' r='6.5' fill='%23888'/%3E%3Cpath d='M20 24c-7 0-12.5 4.6-12.5 10.5V40h25v-5.5C32.5 28.6 27 24 20 24z' fill='%23888'/%3E%3C/svg%3E" alt="Profilo" class="profile-avatar">
    </div>
  </nav>

  <!-- Search Overlay -->
  <div class="search-overlay" id="search-overlay">
    <div class="search-container">
      <button class="close-search" id="close-search" aria-label="Chiudi ricerca"><i class='bx bx-x'></i></button>
      <div class="search-input-wrapper">
        <i class='bx bx-search search-icon'></i>
        <input type="text" id="search-input" placeholder="Cerca film, serie..." autocomplete="off" aria-label="Cerca nel catalogo">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- Mobile Tab Bar -->
  <div class="mobile-tab-bar">
    <a href="index.html" aria-label="Home"><i class='bx bx-home'></i><span>Home</span></a>
    <a href="catalog_series.html" aria-label="Serie"><i class='bx bx-tv'></i><span>Serie</span></a>
    <a href="catalog_movies.html" aria-label="Film"><i class='bx bx-movie-play'></i><span>Film</span></a>
    <a href="calendar.html" class="active" aria-label="Uscite"><i class='bx bxs-calendar'></i><span>Uscite</span></a>
  </div>

  <!-- CALENDAR CONTAINER -->
  <div class="calendar-container">
    <h1 class="calendar-title">Prossime Uscite</h1>

    <div class="cal-filter-bar">
      <label class="cal-toggle-label" id="cal-filter-toggle">
        <div class="cal-toggle" id="cal-toggle"></div>
        Solo la mia lista
      </label>
    </div>

    <div id="loading-calendar"><i class='bx bx-loader-alt bx-spin'></i><br>Ricerca prossimi episodi...</div>
    <div class="calendar-list" id="calendar-grid">
      <!-- Injected via JS -->
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js?v=8"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initCalendar();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</body>
</html>
