<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Serie - Archivio Stream</title>
  <meta name="description" content="Dettagli, stagioni ed episodi della serie.">
  <meta name="theme-color" content="#03030f">
  <meta name="color-scheme" content="dark light">

  <!-- Apply the saved theme before first paint so there is no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=8">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archivio">
  <link rel="apple-touch-icon" href="assets/unnamed.png">
</head>
<body>

  <!-- Detail Top Nav -->
  <nav class="detail-top-nav">
    <a href="javascript:history.back()" class="icon-btn" aria-label="Torna indietro"><i class='bx bx-chevron-left'></i></a>
    <button class="icon-btn" id="share-btn" aria-label="Condividi"><i class='bx bx-share-alt'></i></button>
  </nav>

  <!-- Mobile Tab Bar -->
  <div class="mobile-tab-bar">
    <a href="index.html" aria-label="Home"><i class='bx bx-home'></i><span>Home</span></a>
    <a href="catalog_series.html" aria-label="Serie"><i class='bx bx-tv'></i><span>Serie</span></a>
    <a href="catalog_movies.html" aria-label="Film"><i class='bx bx-movie-play'></i><span>Film</span></a>
    <a href="calendar.html" aria-label="Uscite"><i class='bx bx-calendar'></i><span>Uscite</span></a>
  </div>

  <!-- Hero — artwork, title and metadata are injected by script.js -->
  <header class="hero series-hero" id="detail-hero">
    <div class="hero-fade-overlay" id="hero-fade-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title-text" id="detail-title">Caricamento...</h1>

      <div class="hero-meta" id="detail-meta">
        <!-- Injected via JS -->
      </div>

      <button id="main-play-btn" class="btn btn-primary primary-play-btn"><i class='bx bx-play'></i> Guarda S1 E1</button>

      <div class="btn-action-group">
        <button class="action-btn">
          <i class='bx bx-check'></i>
          <span>La mia lista</span>
        </button>
        <button class="action-btn" id="valuta-btn">
          <i class='bx bx-like'></i>
          <span>Valuta</span>
        </button>
        <button class="action-btn" id="open-gallery-btn">
          <i class='bx bx-dots-horizontal-rounded'></i>
          <span>Immagini</span>
        </button>
      </div>

      <p class="hero-desc" id="detail-desc">
        Caricamento dettagli...
      </p>
    </div>
  </header>

  <!-- Season selector + episode view toggle -->
  <section class="section section-tight-bottom">
    <div class="episode-toolbar">
      <div class="season-selector">
        <select id="season-select" class="season-btn" aria-label="Scegli la stagione">
          <!-- Injected via JS -->
          <option value="1">Stagione 1</option>
        </select>
        <i class='bx bx-chevron-down'></i>
      </div>
      <button id="ep-view-toggle" class="ep-view-toggle" title="Cambia visualizzazione" aria-label="Cambia visualizzazione episodi">
        <i class='bx bx-list-ul'></i>
      </button>
    </div>
  </section>

  <!-- Episodes list -->
  <section class="section section-tight-top">
    <div class="carousel-container" id="episodes-container">
      <!-- Injected via JS -->
    </div>
  </section>

  <script src="config.js"></script>
  <script src="script.js?v=8"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
</body>
</html>
