<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pannello Admin - Archivio Stream</title>
  <meta name="description" content="Gestione degli utenti della piattaforma.">
  <meta name="theme-color" content="#03030f">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">

  <!-- Apply the saved theme before first paint so there is no flash of the wrong theme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="style.css?v=8">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="javascript:history.back()" class="icon-btn" aria-label="Torna indietro"><i class='bx bx-chevron-left'></i></a>
      <span class="admin-nav-title"><i class='bx bx-crown'></i>Pannello Admin</span>
    </div>
  </nav>

  <main class="admin-page">
    <p class="admin-intro">Gestione degli utenti collegati alla piattaforma.</p>

    <!-- Totale / statistiche 24h -->
    <div class="admin-total-banner" id="admin-stats" hidden></div>

    <div class="admin-list" id="admin-users-list">
      <p class="state-msg"><i class='bx bx-loader-alt bx-spin'></i>Caricamento utenti...</p>
    </div>
  </main>

  <!-- Modal log utente -->
  <div class="modal-backdrop" id="user-logs-modal" role="dialog" aria-modal="true" aria-labelledby="modal-user-name">
    <div class="modal-card wide">
      <div class="admin-modal-header">
        <h3 id="modal-user-name"><i class='bx bx-user'></i> Dettaglio Utente</h3>
        <button class="admin-modal-close" id="close-logs-modal" aria-label="Chiudi"><i class='bx bx-x'></i></button>
      </div>

      <div class="admin-modal-body">
        <h4 class="admin-log-title watchlist"><i class='bx bx-list-ul'></i> La sua Lista</h4>
        <div class="admin-log-box" id="modal-watchlist">Caricamento...</div>

        <h4 class="admin-log-title watched"><i class='bx bx-play-circle'></i> Prossimo (Iniziati)</h4>
        <div class="admin-log-box" id="modal-watched">Caricamento...</div>

        <h4 class="admin-log-title vlc"><i class='bx bx-link-external'></i> Click VLC (Richieste)</h4>
        <div class="admin-log-box" id="modal-vlclogs">Caricamento...</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = window.ARCHIVIO_API_BASE || 'https://api-archivio.duckdns.org/api';
    const SUPERADMIN_ID = '919091829';

    const userAuth = localStorage.getItem('user_auth');
    if (!userAuth) {
      window.location.href = 'login.html';
    }

    const parsed = userAuth ? JSON.parse(userAuth) : {};
    const myId = parsed.telegram_id || parsed.id;

    const modal = document.getElementById('user-logs-modal');

    function openModal() {
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }

    document.getElementById('close-logs-modal').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function isOnline(data, id) {
      return !!(data.active && data.active.some((a) => String(a.id) === String(id)));
    }

    async function loadUsers() {
      const container = document.getElementById('admin-users-list');

      try {
        const res = await fetch(`${API_BASE}/admin/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: myId, otp_code: parsed.otp_code })
        });
        const data = await res.json();

        if (!data.success) {
          container.innerHTML = '<p class="state-msg error"><i class="bx bx-lock-alt"></i><strong>Non sei autorizzato</strong>' + escapeHtml(data.error || 'errore sconosciuto') + '</p>';
          return;
        }

        const usersList = data.users || data.all || [];
        container.innerHTML = '';

        if (usersList.length === 0) {
          container.innerHTML = '<p class="state-msg"><i class="bx bx-group"></i>Nessun utente trovato.</p>';
          return;
        }

        // Online users float to the top, then alphabetical.
        usersList.sort((a, b) => {
          const diff = (isOnline(data, b.id) ? 1 : 0) - (isOnline(data, a.id) ? 1 : 0);
          if (diff !== 0) return diff;
          return String(a.username || '').localeCompare(String(b.username || ''), 'it');
        });

        renderStats(data, usersList.length);

        usersList.forEach((u) => {
          container.appendChild(buildUserCard(u, data));
        });

        container.querySelectorAll('.admin-user').forEach((el) => {
          el.addEventListener('click', () => showLogs(el.dataset.id, el.dataset.name));
        });
      } catch (err) {
        console.error('Admin load error:', err);
        container.innerHTML = '<p class="state-msg error"><i class="bx bx-wifi-off"></i><strong>Errore di connessione</strong>Impossibile contattare il server.</p>';
      }
    }

    function renderStats(data, shownCount) {
      const el = document.getElementById('admin-stats');
      const total = data.total != null ? data.total : shownCount;
      const vlc = data.vlc_requests_24h != null ? data.vlc_requests_24h : '—';
      const active24 = data.users_24h != null ? data.users_24h : '—';

      el.innerHTML =
        '<span><i class="bx bx-group"></i> ' + total + ' utenti</span>' +
        '<span><i class="bx bx-pulse"></i> ' + active24 + ' attivi (24h)</span>' +
        '<span><i class="bx bx-play-circle"></i> ' + vlc + ' richieste VLC (24h)</span>';
      el.hidden = false;
    }

    function buildUserCard(u, data) {
      const online = isOnline(data, u.id);
      const shortId = String(u.telegram_id || u.id || '').substring(0, 10);

      const card = document.createElement('div');
      card.className = 'admin-card';

      const avatar = u.profile_pic
        ? '<img class="admin-avatar" src="' + escapeHtml(u.profile_pic) + '" alt="">'
        : '<div class="admin-avatar-fallback">' + escapeHtml((u.username || 'U')[0].toUpperCase()) + '</div>';

      let actionHtml;
      if (String(u.telegram_id) === SUPERADMIN_ID) {
        actionHtml = '<span class="admin-crown"><i class="bx bx-crown"></i> Superadmin</span>';
      } else if (u.otp_code) {
        actionHtml = '<button class="admin-logout-btn" data-id="' + escapeHtml(u.id) + '"><i class="bx bx-exit"></i> Scollega</button>';
      } else {
        actionHtml = '<span class="admin-pill offline"><i class="bx bx-error-circle"></i> Disconnesso</span>';
      }

      card.innerHTML =
        '<div class="admin-user" data-id="' + escapeHtml(u.id) + '" data-name="' + escapeHtml(u.username || 'Sconosciuto') + '">' +
          avatar +
          '<div class="admin-user-text">' +
            '<p class="admin-name"><span class="admin-status-dot ' + (online ? 'online' : 'offline') + '" title="' + (online ? 'Online' : 'Offline') + '"></span>' + escapeHtml(u.username || 'Sconosciuto') + '</p>' +
            '<p class="admin-id">ID: ' + escapeHtml(shortId) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="admin-action">' + actionHtml + '</div>';

      const btn = card.querySelector('.admin-logout-btn');
      if (btn) {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();

          const ok = await window.uiConfirm(
            'Scollegare l\'utente?',
            'Vuoi davvero scollegare ' + (u.username || 'questo utente') + '? Dovrà richiedere un nuovo codice.',
            { okLabel: 'Scollega', danger: true }
          );
          if (!ok) return;

          btn.disabled = true;
          btn.innerHTML = '<i class="bx bx-loader-alt bx-spin"></i> Attendere...';

          try {
            const r = await fetch(`${API_BASE}/admin/users/logout`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user_id: myId, otp_code: parsed.otp_code, target_user_id: u.id })
            });
            const d = await r.json();

            if (d.success) {
              card.classList.add('is-removing');
              setTimeout(() => card.remove(), 300);
              window.showToast((u.username || 'Utente') + ' scollegato.', 'success');
            } else {
              window.showToast('Errore: ' + (d.error || 'sconosciuto'), 'error');
              btn.disabled = false;
              btn.innerHTML = '<i class="bx bx-exit"></i> Scollega';
            }
          } catch (err) {
            window.showToast('Errore di rete', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="bx bx-exit"></i> Scollega';
          }
        });
      }

      return card;
    }

    async function showLogs(targetId, targetName) {
      document.getElementById('modal-user-name').innerHTML =
        '<i class="bx bx-user"></i> ' + escapeHtml(targetName);
      openModal();

      const watchlistEl = document.getElementById('modal-watchlist');
      const watchedEl = document.getElementById('modal-watched');
      const vlcEl = document.getElementById('modal-vlclogs');
      watchlistEl.textContent = 'Caricamento...';
      watchedEl.textContent = 'Caricamento...';
      vlcEl.textContent = 'Caricamento...';

      try {
        const res = await fetch(`${API_BASE}/admin/user/logs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: myId, otp_code: parsed.otp_code, target_user_id: targetId })
        });
        const d = await res.json();

        if (!d.success) {
          const msg = 'Errore: ' + escapeHtml(d.error || 'sconosciuto');
          watchlistEl.textContent = msg;
          watchedEl.textContent = msg;
          vlcEl.textContent = msg;
          return;
        }

        watchlistEl.innerHTML = (d.watchlist && d.watchlist.length)
          ? d.watchlist.map((i) => '• ' + escapeHtml(i.title)).join('<br>')
          : 'Nessun elemento.';

        watchedEl.innerHTML = (d.watched && d.watched.length)
          ? d.watched.map((i) => '• ' + escapeHtml(i.title) + ' (S' + escapeHtml(i.season_number) + ' E' + escapeHtml(i.episode_number) + ')').join('<br>')
          : 'Nessun elemento.';

        vlcEl.innerHTML = (d.vlc_requests && d.vlc_requests.length)
          ? d.vlc_requests.map((i) => {
              const epInfo = (i.type === 'tv' && i.season && i.episode)
                ? ' (S' + escapeHtml(i.season) + ' E' + escapeHtml(i.episode) + ')'
                : '';
              const when = new Date(i.created_at).toLocaleString('it-IT');
              return '<div>• ' + escapeHtml(i.title) + epInfo +
                     '<small class="log-time">' + escapeHtml(when) + '</small></div>';
            }).join('')
          : 'Nessuna richiesta.';
      } catch (err) {
        watchlistEl.textContent = 'Errore di rete.';
        watchedEl.textContent = 'Errore di rete.';
        vlcEl.textContent = 'Errore di rete.';
      }
    }

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
