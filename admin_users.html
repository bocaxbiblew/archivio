<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Admin - Archivio Stream</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Floating Sidebar (Desktop) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <img src="assets/unnamed.png" alt="Logo" class="sidebar-logo" onclick="window.location.href='index.html'">
    </div>
    <ul class="sidebar-links">
      <li><a href="index.html"><i class='bx bx-home-alt-2'></i> <span>Home</span></a></li>
      <li><a href="catalog_series.html"><i class='bx bx-tv'></i> <span>Serie</span></a></li>
      <li><a href="catalog_movies.html"><i class='bx bx-movie-play'></i> <span>Film</span></a></li>
      <li><a href="calendar.html"><i class='bx bx-calendar-star'></i> <span>Uscite</span></a></li>
    </ul>
    <div class="sidebar-bottom">
      <a href="https://t.me/+w-cVyPMl7B5lOGY0" target="_blank" class="icon-btn" title="Canale Telegram"><i class='bx bx-bulb'></i></a>
      <button class="icon-btn" id="open-search"><i class='bx bx-search'></i></button>
      <button class="icon-btn" title="La mia lista"><i class='bx bx-bookmark'></i></button>
      <img src="https://placehold.co/100x100/ffcc00/000?text=User" alt="Profile" class="profile-avatar">
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main class="main-content">

  <div style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <p style="color: #aaa; margin-bottom: 2rem;">Gestione degli utenti collegati alla piattaforma.</p>
    <div id="admin-users-list" style="display: flex; flex-direction: column; gap: 10px;">
      <p style="color: #fff;"><i class='bx bx-loader-alt bx-spin'></i> Caricamento utenti...</p>
    </div>
  </div>


  <!-- Modal Log Utente -->
  <div id="user-logs-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center;">
    <div style="background:#1a1a1a; width:90%; max-width:600px; max-height:80vh; border-radius:12px; padding:20px; overflow-y:auto; border:1px solid rgba(255,255,255,0.1);">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; margin-bottom:15px;">
        <h3 id="modal-user-name" style="color:white; margin:0;"><i class='bx bx-user' style="color:#f5c518;"></i> Dettaglio Utente</h3>
        <button onclick="document.getElementById('user-logs-modal').style.display='none'" style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;"><i class='bx bx-x'></i></button>
      </div>
      
      <h4 style="color:#f5c518; margin-bottom:5px;"><i class='bx bx-list-ul'></i> La sua Lista</h4>
      <div id="modal-watchlist" style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; margin-bottom:15px; max-height:150px; overflow-y:auto; font-size:0.9rem; color:#ccc;">Caricamento...</div>
      
      <h4 style="color:#4CAF50; margin-bottom:5px;"><i class='bx bx-play-circle'></i> Prossimo (Iniziati)</h4>
      <div id="modal-watched" style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; margin-bottom:15px; max-height:150px; overflow-y:auto; font-size:0.9rem; color:#ccc;">Caricamento...</div>
      
      <h4 style="color:#ff4444; margin-bottom:5px;"><i class='bx bx-link-external'></i> Click VLC (Richieste)</h4>
      <div id="modal-vlclogs" style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; max-height:150px; overflow-y:auto; font-size:0.9rem; color:#ccc;">Caricamento...</div>
    </div>
  </div>

  <script>

    const API_BASE = 'https://api-archivio.duckdns.org/api';
    
    async function loadUsers() {
      const userAuth = localStorage.getItem('user_auth');
      if (!userAuth) {
        window.location.href = 'index.html';
        return;
      }
      
      const parsed = JSON.parse(userAuth);
      
      try {
        const res = await fetch(API_BASE + '/admin/users', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            user_id: parsed.telegram_id || parsed.id,
            otp_code: parsed.otp_code
          })
        });
        const data = await res.json();
        
        const container = document.getElementById('admin-users-list');
        container.innerHTML = '';
        
        // The API might return data.users or data.all
        const usersList = data.users || data.all || [];
        
        if (!data.success) {
          container.innerHTML = '<p style="color:#ff4444;">Non sei autorizzato: ' + (data.error || 'errore sconosciuto') + '</p>';
          return;
        }
        
        if (usersList.length === 0) {
          container.innerHTML = '<p style="color:#aaa;">Nessun utente trovato.</p>';
          return;
        }

        usersList.sort(function(a, b) {
           var aOnline = data.active && data.active.some(act => act.id === a.id) ? 1 : 0;
           var bOnline = data.active && data.active.some(act => act.id === b.id) ? 1 : 0;
           return bOnline - aOnline;
        });

        var totalBanner = document.createElement('div');
        totalBanner.style.cssText = 'background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; color: #f5c518; text-align: center; border: 1px solid rgba(245,197,24,0.3);';
        totalBanner.innerHTML = '<i class="bx bx-group"></i> Totale Utenti Registrati: ' + usersList.length;
        container.parentNode.insertBefore(totalBanner, container);
        
        usersList.forEach(function(u) {
          var shortId = String(u.telegram_id || u.id || '').substring(0, 10);
          var userCard = document.createElement('div');
          userCard.style.cssText = 'background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1);';
          
          var isSuperadmin = (String(u.telegram_id) === '919091829');
          var isOnline = data.active && data.active.some(a => a.id === u.id);
          var statusDot = isOnline ? 
            '<span style="display:inline-block; width:10px; height:10px; background:#4CAF50; border-radius:50%; margin-right:8px; box-shadow: 0 0 8px #4CAF50;" title="Online"></span>' : 
            '<span style="display:inline-block; width:10px; height:10px; background:#f44336; border-radius:50%; margin-right:8px;" title="Offline"></span>';

          var profilePicHtml = u.profile_pic ? 
            '<img src="' + u.profile_pic + '" style="width:35px; height:35px; border-radius:50%; object-fit:cover; margin-right: 15px; display:inline-block; vertical-align:middle;">' : 
            '<div style="width: 35px; height: 35px; border-radius: 50%; background: #f5c518; display:inline-flex; justify-content:center; align-items:center; font-weight:bold; color:black; margin-right:15px; vertical-align:middle;">' + (u.username || 'U')[0].toUpperCase() + '</div>';

          var actionHtml = '';
          if (isSuperadmin) {
            actionHtml = '<span style="color:#f5c518; font-weight:bold; font-size:0.9rem;"><i class="bx bx-crown"></i> Superadmin</span>';
          } else if (u.otp_code) {
            actionHtml = '<button class="admin-logout-btn" data-id="' + u.id + '" style="background:#d32f2f; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; gap:5px; font-weight: bold; position: relative; z-index: 10;"><i class="bx bx-exit"></i> Scollega</button>';
          } else {
            actionHtml = '<span style="color:#e65100; font-size:0.8rem; font-weight:bold; background:rgba(230,81,0,0.1); padding:4px 8px; border-radius:4px;"><i class="bx bx-error-circle"></i> Disconnesso</span>';
          }
          
          userCard.innerHTML = '<div style="display:flex; align-items:center; cursor:pointer; flex-grow:1;" class="user-detail-trigger" data-id="' + u.id + '" data-name="' + (u.username || 'Sconosciuto') + '">' +
            profilePicHtml + 
            '<div>' +
            '<p style="margin:0; font-size:1.1rem; font-weight:bold; color:white; display:flex; align-items:center;">' + statusDot + (u.username || 'Sconosciuto') + '</p>' +
            '<p style="margin:0; font-size:0.85rem; color:#aaa; margin-top:4px;">ID: ' + shortId + '</p>' +
            '</div></div>' +
            '<div>' + actionHtml + '</div>';
          
          var btn = userCard.querySelector('.admin-logout-btn');
          if (btn) {
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              if (!confirm('Vuoi davvero scollegare ' + (u.username || 'questo utente') + '?')) return;
              
              btn.innerText = 'Attendere...';
              btn.disabled = true;
              
              fetch(API_BASE + '/admin/users/logout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  user_id: parsed.telegram_id || parsed.id,
                  otp_code: parsed.otp_code,
                  target_user_id: u.id
                })
              })
              .then(function(r) { return r.json(); })
              .then(function(d) {
                if (d.success) {
                  userCard.style.opacity = '0';
                  userCard.style.transition = 'opacity 0.3s';
                  setTimeout(function() { userCard.remove(); }, 300);
                } else {
                  alert('Errore: ' + (d.error || 'sconosciuto'));
                  btn.innerText = 'Scollega';
                  btn.disabled = false;
                }
              })
              .catch(function() {
                alert('Errore di rete');
                btn.innerText = 'Scollega';
                btn.disabled = false;
              });
            });
          }
          
          container.appendChild(userCard);
        });
        
        // Listener per aprire il modale dei log utente
        document.querySelectorAll('.user-detail-trigger').forEach(function(el) {
          el.addEventListener('click', async function() {
            var targetId = this.getAttribute('data-id');
            var targetName = this.getAttribute('data-name');
            document.getElementById('modal-user-name').innerHTML = "<i class='bx bx-user' style='color:#f5c518;'></i> " + targetName;
            document.getElementById('user-logs-modal').style.display = 'flex';
            
            document.getElementById('modal-watchlist').innerHTML = "Caricamento...";
            document.getElementById('modal-watched').innerHTML = "Caricamento...";
            document.getElementById('modal-vlclogs').innerHTML = "Caricamento...";
            
            try {
              const res = await fetch(API_BASE + '/admin/user/logs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  user_id: parsed.telegram_id || parsed.id,
                  otp_code: parsed.otp_code,
                  target_user_id: targetId
                })
              });
              const d = await res.json();
              if(d.success) {
                // Watchlist
                if(d.watchlist && d.watchlist.length > 0) {
                  document.getElementById('modal-watchlist').innerHTML = d.watchlist.map(i => "• " + i.title).join('<br>');
                } else {
                  document.getElementById('modal-watchlist').innerHTML = "Nessun elemento.";
                }
                // Watched
                if(d.watched && d.watched.length > 0) {
                  document.getElementById('modal-watched').innerHTML = d.watched.map(i => "• " + i.title + " (S" + i.season_number + " E" + i.episode_number + ")").join('<br>');
                } else {
                  document.getElementById('modal-watched').innerHTML = "Nessun elemento.";
                }
                // VLC Logs
                if(d.vlc_requests && d.vlc_requests.length > 0) {
                  document.getElementById('modal-vlclogs').innerHTML = d.vlc_requests.map(i => {
                    let epInfo = (i.type === 'tv' && i.season && i.episode) ? " (S" + i.season + " E" + i.episode + ")" : "";
                    let dStr = new Date(i.created_at).toLocaleString('it-IT');
                    return "<div style='margin-bottom: 5px;'>• " + i.title + epInfo + " <br><small style='color:#888; padding-left: 10px;'>" + dStr + "</small></div>";
                  }).join('');
                } else {
                  document.getElementById('modal-vlclogs').innerHTML = "Nessuna richiesta.";
                }
              } else {
                document.getElementById('modal-watchlist').innerHTML = "Errore: " + (d.error || 'sconosciuto');
                document.getElementById('modal-watched').innerHTML = "Errore: " + (d.error || 'sconosciuto');
                document.getElementById('modal-vlclogs').innerHTML = "Errore: " + (d.error || 'sconosciuto');
              }
            } catch(e) {
              document.getElementById('modal-watchlist').innerHTML = "Errore di rete.";
              document.getElementById('modal-watched').innerHTML = "Errore di rete.";
              document.getElementById('modal-vlclogs').innerHTML = "Errore di rete.";
            }
          });
        });

      } catch (err) {
        console.error('Admin load error:', err);
        document.getElementById('admin-users-list').innerHTML = '<p style="color:#ff4444;">Errore di connessione al server.</p>';
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>

</main>
</body>
</html>
